set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# set-option -g @easyjump-key-binding "é"
set -g @plugin 'roy2220/easyjump.tmux'

run '~/.tmux/plugins/tpm/tpm'

bind-key -T copy-mode-vi é run-shell -b "python ~/.tmux/plugins/easyjump.tmux/easyjump.py --mode=xcopy --auto-begin-selection=off"


bind-key -n M-i switch-client -p
bind-key -n M-e switch-client -n
bind-key -n M-p new-session
bind-key -n M-é confirm-before -p "Kill #S (y/n)?" "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'"

set -g status-position bottom
set -g status-left '#[bg=green]#S  '
set -g status-right '#(pwd)  #[bg=yellow]#(echo $USER)@#H'
set -g status-justify centre
set-window-option -g window-status-current-format ""

set-option -g focus-events on

set-option -g default-terminal "screen-256color"
set-option -sa terminal-features ',screen-256color:RGB'
set-option -ga terminal-overrides ',screen-256color:Tc'

set -g status off
set -s escape-time 0
new-session -n "main"

set -g mouse on
setw -g mode-keys vi
# use Alt-n instead of ctrl-b + [ to enter copymode
bind-key -n M-n copy-mode
if-shell '[ "$TERM_PROGRAM" = "vscode" ]' {
  bind-key -n C-u 'copy-mode ; send-keys -X halfpage-up'
}
# Navigation remaps in copy mode
bind-key -T copy-mode-vi 'c' send -X cursor-left
bind-key -T copy-mode-vi 't' send -X cursor-down
bind-key -T copy-mode-vi 's' send -X cursor-up
bind-key -T copy-mode-vi 'r' send -X cursor-right
bind-key -T copy-mode-vi 'j' command-prompt -1 -p "(jump to forward)" { send-keys -X jump-to-forward "%%" }
bind-key -T copy-mode-vi 'J' command-prompt -1 -p "(jump to backward)" { send-keys -X jump-to-backward "%%" }
# use v instead of Space to begin selection, like in vim
bind -T copy-mode-vi v send -X begin-selection
# use y instead of Enter to copy selection, like in vim
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard"
# Address vim mode switching delay
set -s escape-time 10
