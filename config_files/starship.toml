format = """
${custom.hostname}\
${custom.docker}\
${custom.docker_camera}\
${custom.docker_privileged}\
${custom.docker_end}\
${custom.python_venv}\
[](red)\
${custom.exo}\
${custom.simu}\
${custom.other}\
${custom.workspace}\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_commit\
[](fg:yellow bg:lime)\
$git_state\
$git_status\
$git_metrics\
[](fg:green bg:sapphire)\
$time\
[](fg:sapphire bg:blue)\
$cmd_duration\
[](fg:blue bg:lavender)\
$status\
[ ](fg:lavender)\
$line_break\
$character
"""

continuation_prompt = '▶▶ '

palette = 'catppuccin_frappe'


[custom.hostname]
command = 'echo 🧌'
format = '[](subtext0)[$output](bg:subtext0 fg:crust)[](subtext0)'
when = """ test "$(hostname)" "==" "cyclope" """

[custom.docker]
command = 'echo 🐳'
format = '[](subtext0)[$output](bg:subtext0 fg:crust)'
when = """ test "$WDC_INSIDE_DOCKER" "==" "1" """

[custom.docker_camera]
command = 'echo 📷'
format = '[$output](bg:subtext0 fg:crust)'
when = """ test "-n" "$WDC_INSIDE_CAMERA_DOCKER" """

[custom.docker_privileged]
command = 'echo ⭐'
format = '[$output](bg:subtext0 fg:crust)'
when = """ test "-n" "$WDC_INSIDE_PRIVILEGED_DOCKER" """

[custom.docker_end]
command = 'echo 🐳'
format = '[](subtext0)'
when = """ test "$WDC_INSIDE_DOCKER" "==" "1" """

[custom.python_venv]
command = 'echo $(basename $VIRTUAL_ENV)'
format = '[](subtext0)[🐍$output](bg:subtext0 fg:crust)[](subtext0)'
when = """ test "-n" "$VIRTUAL_ENV" -a "$VIRTUAL_ENV" "!=" "$HOME/global_tools" -a "$VIRTUAL_ENV" "!=" "/install" """

[custom.workspace]
command = 'echo $WDC_WORKSPACE_SHORT'
format = '[ $output]($style)'
when = """ test "-n" "$WDC_WORKSPACE_SHORT" """
style = "bold bg:red fg:crust"

[custom.exo]
command = 'echo 🤖'
format = '[$output]($style)'
style = "bg:red fg:crust"
when = """ test "$WDC_ENV" "==" "exo" """

[custom.simu]
command = 'echo 💻'
format = '[$output]($style)'
style = "bg:red fg:crust"
when = """ test "$WDC_ENV" "==" "simu" """

[custom.other]
command = 'echo ${WDC_ENV::1}'
format = '[$output]($style)'
style = "bg:red fg:crust"
when = """ test "$WDC_ENV" "!=" "simu" -a "$WDC_ENV" "!=" "exo" """

[directory]
fish_style_pwd_dir_length = 1
style = "bg:peach fg:crust"
format = '[$path$read_only]($style)'

[git_branch]
style = "bg:yellow fg:crust"
format = '[ $symbol$branch(:$remote_branch)]($style)'

[git_commit]
style = "bg:yellow fg:crust"
format = '[\($hash$tag\)]($style)'

[git_metrics]
disabled = true
format = '([$added]($added_style))([$deleted]($deleted_style)) [|](bold purple)'

[git_state]
format='[\($state( $progress_current/$progress_total)\)]($style)'
style='fg:crust bg:lime'
rebase=''
cherry_pick=''

[git_status]
format = """
[$ahead_behind](fg:crust bg:lime)\
[](fg:lime bg:green)\
$conflicted\
$modified\
$renamed\
$deleted\
$staged\
$untracked\
$stashed\
"""
ahead = '⇡${count}'
behind = '⇣${count}'
up_to_date = ''
diverged = '⇡${ahead_count}⇣${behind_count}'
conflicted = '[☠$count](bg:green fg:red)'
modified = '[$count](bg:green fg:yellow)'
renamed = '[$count](bg:green fg:cyan)'
deleted = '[$count](bold bg:green fg:cyan)'
staged = '[$count](bg:green fg:cyan)'
untracked = '[$count](bg:green fg:text)'
stashed = '[$count](bg:green fg:text)'

[time]
disabled = false
format = '[ $time ]($style)'
style = 'bg:sapphire fg:crust'

[cmd_duration]
show_milliseconds = true
min_time = 100
format = '[\[⏱ $duration\]](bold bg:blue fg:crust)'
show_notifications = true
min_time_to_notify = 45_000


[status]
disabled = false
# success_symbol = "✔"
# success_style = "bg:lavender fg:lime"
map_symbol = true
style = "bg:lavender fg:crust"
format = '[$symbol$common_meaning$signal_name$maybe_int]($style)'
pipestatus = true

[character]
vimcmd_symbol = '[⬮](bold flamingo)'

